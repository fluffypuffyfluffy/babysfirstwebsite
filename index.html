      .strawberry-bg.broider::before {

      /* Hover image effect for 'wedding cakes' */

        position: relative;
        cursor: pointer;
        display: inline-block;

      }


      .hover-image .hover-img-backdrop {
        position: absolute;
        width: 100%;
        height: 100%;
        background: rgba(255,255,255,0.7);
        /* Match the image size exactly */
        max-width: 500px;
      }

      .hover-image .hover-img {
        position: relative;
        width: 100%;
        max-width: 500px;
        opacity: 0.5;
        display: block;
      }

      /* Randomize hover image position, avoid covering hovered word */
      .hover-image .hover-img-container {
        display: none;
        position: fixed;
        z-index: 500; /* Images behind the text */
        pointer-events: none;
      }
      .hover-image:hover .hover-img-container,
      .hover-image:focus .hover-img-container {
        display: block;
      }

<body>
  <div class="strawberry-bg broider">
<header>
      <img src="https://i.picasion.com/gl/92/ktnp.gif" class="header-gif" alt="hi there, hal here!">
</header>
    <main>
      <section id="bio-content">
        <!-- Bio content will be loaded from bio.md -->
      </section>
    </main>
  </div>
  <link rel="icon" type="image/x-icon" href="images/favicon.ico">
  
  <!-- Markdown parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
  
  <script>
    // Load and render bio.md
    async function loadBio() {
      try {
        const response = await fetch('bio.md');
        const markdown = await response.text();
        
        // Configure marked to open external links in new tabs
        marked.use({
          renderer: {
            link(href, title, text) {
              const isExternal = href.startsWith('http://') || href.startsWith('https://');
              const target = isExternal ? ' target="_blank" rel="noopener"' : '';
              const titleAttr = title ? ` title="${title}"` : '';
              return `<a href="${href}"${titleAttr}${target}>${text}</a>`;
            }
          }
        });
        
        // Convert markdown to HTML and wrap paragraphs
        const html = marked.parse(markdown);
        document.getElementById('bio-content').innerHTML = html;
        
        // Initialize hover image functionality after content is loaded
        initHoverImages();
      } catch (error) {
        console.error('Error loading bio:', error);
        document.getElementById('bio-content').innerHTML = '<p>Error loading bio content.</p>';
      }
    }
    
    // Initialize hover image effects
    function initHoverImages() {
      document.querySelectorAll('.hover-image').forEach(function(span) {
        span.addEventListener('mouseenter', function(e) {
          var container = span.querySelector('.hover-img-container');
          if (!container) return;
          var img = container.querySelector('.hover-img');
          if (!img) return;
          
          // Simple random positioning
          var left = Math.random() * Math.max(0, window.innerWidth - 700);
          var top = Math.random() * Math.max(0, window.innerHeight - 400);
          container.style.left = left + 'px';
          container.style.top = top + 'px';
        });
        
        span.addEventListener('mouseleave', function() {
          var container = span.querySelector('.hover-img-container');
          if (container) {
            container.style.left = '';
            container.style.top = '';
            container.style.transform = '';
          }
        });
      });
    }
    
    // Load bio when page loads
    document.addEventListener('DOMContentLoaded', loadBio);
  </script>
